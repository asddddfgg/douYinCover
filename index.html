<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音爆款封面设计器 - 专业版 v3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>抖音爆款封面设计专家</span>
            </div>
            <div class="header-actions">
                <button id="btn-templates" class="btn secondary"><i class="fa-solid fa-layer-group"></i> 模板库</button>
                <button id="btn-upload-bg" class="btn secondary"><i class="fa-solid fa-image"></i> 本地背景</button>
                <input type="file" id="bg-file-input" accept="image/*" style="display: none;">
                <button id="btn-export" class="btn primary"><i class="fa-solid fa-download"></i> 导出封面</button>
            </div>
        </header>

        <!-- 主体工作区 -->
        <div class="main-workspace">
            <!-- 左侧控制面板 -->
            <aside class="sidebar-left">
                <div class="panel-section">
                    <h3><i class="fa-solid fa-heading"></i> 主标题设置</h3>
                    <div class="form-group">
                        <textarea id="main-title-text" rows="2" placeholder="输入主标题文案...">爆款涨粉秘籍</textarea>
                    </div>
                    <div class="form-row">
                        <label>字号大小: <span id="main-size-val">48px</span></label>
                        <input type="range" id="main-font-size" min="20" max="100" value="48">
                    </div>
                    <div class="form-row">
                        <label>文字颜色</label>
                        <input type="color" id="main-text-color" value="#ffffff">
                    </div>
                    <div class="form-row">
                        <label>描边颜色</label>
                        <input type="color" id="main-stroke-color" value="#000000">
                    </div>
                </div>

                <div class="panel-section">
                    <h3><i class="fa-solid fa-align-left"></i> 副标题设置</h3>
                    <div class="form-group">
                        <textarea id="sub-title-text" rows="2" placeholder="输入副标题文案...">3天突破10000粉丝播放</textarea>
                    </div>
                    <div class="form-row">
                        <label>字号大小: <span id="sub-size-val">28px</span></label>
                        <input type="range" id="sub-font-size" min="16" max="60" value="28">
                    </div>
                    <div class="form-row">
                        <label>文字颜色</label>
                        <input type="color" id="sub-text-color" value="#ffeb3b">
                    </div>
                </div>

                <div class="panel-section">
                    <h3><i class="fa-solid fa-palette"></i> 一键特效风格 (实时多卡片同步)</h3>
                    <div class="effect-buttons" id="effect-presets">
                        <button class="effect-btn active" data-effect="normal">默认样式</button>
                        <button class="effect-btn" data-effect="gradient">双色渐变</button>
                        <button class="effect-btn" data-effect="neon">霓虹发光</button>
                        <button class="effect-btn" data-effect="stereo">3D立体</button>
                        <button class="effect-btn" data-effect="cyber">赛博机甲</button>
                        <button class="effect-btn" data-effect="glitch">故障艺术</button>
                        <button class="effect-btn" data-effect="retro">复古港风</button>
                        <button class="effect-btn" data-effect="gold">暗金奢华</button>
                        <button class="effect-btn" data-effect="fire">烈火熔岩</button>
                    </div>
                    <div class="custom-style-box" style="margin-top: 12px;">
                        <button id="btn-custom-style" class="btn secondary" style="width: 100%; justify-content: center;"><i class="fa-solid fa-plus"></i> 自定义上传/添加新风格</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3><i class="fa-solid fa-icons"></i> 贴纸库 (<span id="sticker-count">72</span>)</h3>
                    <div class="sticker-categories" id="sticker-cats">
                        <button class="cat-btn active" data-cat="all">全部</button>
                        <button class="cat-btn" data-cat="badge">徽章</button>
                        <button class="cat-btn" data-cat="arrow">箭头</button>
                        <button class="cat-btn" data-cat="emoji">表情</button>
                        <button class="cat-btn" data-cat="hot">热点</button>
                    </div>
                    <div class="sticker-grid" id="sticker-grid"></div>
                </div>
            </aside>

            <!-- 中间预览与编辑区 -->
            <main class="preview-area">
                <div class="canvas-container" id="canvas-container">
                    <div class="cover-bg" id="cover-bg"></div>
                    <div class="safe-line">
                        <span class="safe-text">抖音推荐/评论区防遮挡安全线</span>
                    </div>

                    <!-- 主标题图层：支持固定左顶点拖动、右侧拖拽改变容器宽/高而字号不变 -->
                    <div class="draggable-layer text-layer active" id="layer-main-title" style="top: 40%; left: 10%; width: 280px; height: auto;">
                        <div class="layer-content" contenteditable="true" spellcheck="false">爆款涨粉秘籍</div>
                        <div class="resize-handle top-left" data-handle="tl"></div>
                        <div class="resize-handle top-right" data-handle="tr"></div>
                        <div class="resize-handle bottom-left" data-handle="bl"></div>
                        <div class="resize-handle bottom-right" data-handle="br"></div>
                        <div class="resize-handle right-edge" data-handle="r" title="拖动改变宽度/高度，字号不变"></div>
                    </div>

                    <!-- 副标题图层 -->
                    <div class="draggable-layer text-layer" id="layer-sub-title" style="top: 60%; left: 10%; width: 280px; height: auto;">
                        <div class="layer-content" contenteditable="true" spellcheck="false">3天突破10000粉丝播放</div>
                        <div class="resize-handle top-left" data-handle="tl"></div>
                        <div class="resize-handle top-right" data-handle="tr"></div>
                        <div class="resize-handle bottom-left" data-handle="bl"></div>
                        <div class="resize-handle bottom-right" data-handle="br"></div>
                        <div class="resize-handle right-edge" data-handle="r" title="拖动改变宽度/高度，字号不变"></div>
                    </div>
                </div>
                <div class="preview-tip">
                    <i class="fa-solid fa-circle-info"></i> 提示：右侧边缘手柄拖拽可改变文本框宽高而不改变字号；四角拖拽可缩放字号；右键可复制/删除。
                </div>
            </main>

            <!-- 右侧多卡片同步预览面板 (联动特效风格、文案、背景等) -->
            <aside class="sidebar-right">
                <h3><i class="fa-solid fa-clone"></i> 多风格/多卡片实时同步预览</h3>
                <div class="sync-cards-container" id="sync-cards-container">
                    <!-- 动态根据特效和卡片生成同步效果 -->
                </div>
            </aside>
        </div>
    </div>

    <!-- 模态框：模板库 -->
    <div class="modal" id="template-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>选择爆款封面模板</h3>
                <button class="close-modal" id="close-template-modal">&times;</button>
            </div>
            <div class="modal-body" id="template-grid"></div>
        </div>
    </div>

    <!-- 模态框：自定义风格添加 -->
    <div class="modal" id="custom-style-modal">
        <div class="modal-content" style="width: 450px;">
            <div class="modal-header">
                <h3>添加自定义特效风格</h3>
                <button class="close-modal" id="close-custom-modal">&times;</button>
            </div>
            <div class="modal-body" style="display: flex; flex-direction: column; gap: 14px;">
                <div class="form-group">
                    <label>风格名称</label>
                    <input type="text" id="custom-style-name" placeholder="例如：极光炫彩" style="width:100%; padding:8px; background:#252525; border:1px solid #333; color:#fff; border-radius:4px;">
                </div>
                <div class="form-group">
                    <label>CSS 文字阴影 (text-shadow)</label>
                    <input type="text" id="custom-style-shadow" placeholder="0 0 15px #00ffcc, 0 0 30px #00ffcc" style="width:100%; padding:8px; background:#252525; border:1px solid #333; color:#fff; border-radius:4px;">
                </div>
                <div class="form-group">
                    <label>文字渐变或颜色</label>
                    <input type="text" id="custom-style-color" placeholder="#00ffcc 或 linear-gradient(...)" style="width:100%; padding:8px; background:#252525; border:1px solid #333; color:#fff; border-radius:4px;">
                </div>
                <button id="btn-save-custom-style" class="btn primary" style="justify-content: center; margin-top: 10px;">保存并应用新风格</button>
            </div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div class="context-menu" id="context-menu">
        <ul>
            <li id="menu-copy"><i class="fa-solid fa-copy"></i> 复制图层</li>
            <li id="menu-delete"><i class="fa-solid fa-trash"></i> 删除图层</li>
        </ul>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/state.js"></script>
    <script src="js/db.js"></script>
    <script src="js/stickers.js"></script>
    <script src="js/text-layers.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
