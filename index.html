<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音爆款封面设计器 (Canva Ultimate Pro)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-palette"></i> <span>抖音爆款封面 <small>Canva 极速版</small></span>
            </div>
            
            <div id="text-toolbar" class="top-text-toolbar" style="display: none;">
                <select id="tb-font" title="字体">
                    <option value="sans-serif">系统黑体</option>
                    <option value="serif">宋体/衬线体</option>
                    <option value="monospace">等宽体</option>
                    <option value="cursive">手写艺术体</option>
                </select>
                <button id="btn-upload-font" class="tool-btn" title="上传本地手写字体 (.ttf/.otf)" style="width: auto; padding: 0 6px; font-size: 10px;">
                    <i class="fa-solid fa-upload"></i> 自定义字体
                </button>
                <input type="file" id="local-font-file" accept=".ttf,.otf" style="display: none;">

                <div class="toolbar-separator"></div>
                <select id="tb-fontsize" title="字号">
                    <option value="16px">16px</option>
                    <option value="20px">20px</option>
                    <option value="24px">24px</option>
                    <option value="28px" selected>28px</option>
                    <option value="36px">36px</option>
                    <option value="48px">48px</option>
                    <option value="64px">64px</option>
                    <option value="80px">80px</option>
                </select>
                <div class="toolbar-separator"></div>
                <div class="color-picker-wrapper" title="文字颜色">
                    <input type="color" id="tb-color" value="#ffffff">
                </div>
                <div class="color-picker-wrapper" title="背景底色">
                    <input type="color" id="tb-bgcolor" value="#000000">
                </div>
                <div class="toolbar-separator"></div>
                <button id="tb-bold" class="tool-btn" title="粗体"><i class="fa-solid fa-bold"></i></button>
                <button id="tb-italic" class="tool-btn" title="斜体"><i class="fa-solid fa-italic"></i></button>
                <button id="tb-underline" class="tool-btn" title="下划线"><i class="fa-solid fa-underline"></i></button>
                <button id="tb-strike" class="tool-btn" title="删除线"><i class="fa-solid fa-strikethrough"></i></button>
                <div class="toolbar-separator"></div>
                <button id="tb-align-left" class="tool-btn" title="左对齐"><i class="fa-solid fa-align-left"></i></button>
                <button id="tb-align-center" class="tool-btn" title="居中"><i class="fa-solid fa-align-center"></i></button>
                <button id="tb-align-right" class="tool-btn" title="右对齐"><i class="fa-solid fa-align-right"></i></button>
                <button id="tb-bullet" class="tool-btn" title="项目符号"><i class="fa-solid fa-list-ul"></i></button>
                <div class="toolbar-separator"></div>
                <button id="tb-vertical" class="tool-btn" title="竖排文字"><i class="fa-solid fa-grip-lines-vertical"></i></button>
                <div class="toolbar-separator"></div>
                <div class="slider-group" title="字间距">
                    <span>字距</span>
                    <input type="range" id="tb-letter-spacing" min="-5" max="30" value="0" step="1">
                </div>
                <div class="slider-group" title="行间距">
                    <span>行距</span>
                    <input type="range" id="tb-line-height" min="1" max="3" value="1.2" step="0.1">
                </div>
                <div class="slider-group" title="透明度">
                    <span>透明</span>
                    <input type="range" id="tb-opacity" min="0.1" max="1" value="1" step="0.05">
                </div>
            </div>

            <div class="actions">
                <button id="btn-add-text" class="btn"><i class="fa-solid fa-heading"></i> 添加文本</button>
                <button id="btn-add-sticker" class="btn"><i class="fa-solid fa-face-smile"></i> 添加贴纸</button>
                <button id="btn-export" class="btn btn-primary"><i class="fa-solid fa-download"></i> 导出 9:16 封面</button>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar-left">
                <div class="panel-section">
                    <h3><i class="fa-solid fa-wand-magic-sparkles"></i> 20款艺术特效</h3>
                    <p class="hint">选中画布图层后点击应用特效</p>
                    <div id="effects-grid" class="effects-grid"></div>
                </div>
            </aside>

            <main class="canvas-container"></main>

            <aside class="sidebar-right">
                <div class="panel-section">
                    <h3><i class="fa-solid fa-image"></i> 背景画布</h3>
                    <div class="control-group">
                        <label>背景类型</label>
                        <select id="bg-type">
                            <option value="gradient">时尚双色渐变</option>
                            <option value="solid">纯色背景</option>
                            <option value="image">自定义背景图片</option>
                        </select>
                    </div>
                    <div id="bg-color-controls" class="control-group">
                        <label>渐变调色板 / 纯色预设</label>
                        <div class="color-pickers">
                            <input type="color" id="bg-color-1" value="#ff2442">
                            <input type="color" id="bg-color-2" value="#2575fc">
                        </div>
                    </div>
                    <div id="bg-image-controls" class="control-group" style="display:none;">
                        <label>上传本地图片</label>
                        <input type="file" id="bg-image-file" accept="image/*">
                    </div>

                    <div class="control-group" style="margin-top: 15px; border-top: 1px solid #30363d; padding-top: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <label style="margin: 0;"><i class="fa-solid fa-star" style="color: #f1e05a;"></i> 背景收藏夹</label>
                            <button id="btn-fav-bg" class="btn" style="padding: 2px 6px; font-size: 10px;"><i class="fa-solid fa-plus"></i> 收藏当前背景</button>
                        </div>
                        <div id="fav-bg-list" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 100px; overflow-y: auto;"></div>
                    </div>
                </div>

                <!-- ============ 文字底衬特效（升级版） ============ -->
                <div class="panel-section">
                    <h3><i class="fa-solid fa-note-sticky"></i> 文字底衬特效</h3>
                    <p class="hint">选中文字图层后，点击底衬卡片即可叠加到文字背后</p>

                    <div class="backdrop-tabs" id="backdrop-tabs">
                        <div class="backdrop-tab active" data-cat="paper">纸质</div>
                        <div class="backdrop-tab" data-cat="texture">材质</div>
                        <div class="backdrop-tab" data-cat="decor">装饰</div>
                        <div class="backdrop-tab" data-cat="custom">自定义</div>
                    </div>

                    <div id="backdrop-grid" class="backdrop-grid"></div>

                    <div class="backdrop-actions-row">
                        <button id="btn-backdrop-upload" class="btn" style="flex:1; justify-content:center; font-size:11px;">
                            <i class="fa-solid fa-upload"></i> 上传底衬图片
                        </button>
                        <input type="file" id="backdrop-file-input" accept="image/*" style="display:none;">
                        <button id="btn-backdrop-format" class="btn" style="flex:1; justify-content:center; font-size:11px;" title="查看/复制底衬格式">
                            <i class="fa-solid fa-code"></i> 查看格式
                        </button>
                    </div>

                    <div class="control-group" style="margin-top: 10px;">
                        <label>底衬颜色</label>
                        <input type="color" id="backdrop-color" value="#fff8dc" style="width:100%;height:28px;border:1px solid #30363d;border-radius:4px;background:none;cursor:pointer;">
                    </div>
                    <div class="control-group">
                        <label>外扩边距 <span id="backdrop-pad-val">12</span>px</label>
                        <input type="range" id="backdrop-padding" min="0" max="40" value="12" style="width:100%;accent-color:#ff2442;">
                    </div>
                    <div class="control-group">
                        <label>轻微旋转 <span id="backdrop-rot-val">0</span>°</label>
                        <input type="range" id="backdrop-rotate" min="-15" max="15" value="0" style="width:100%;accent-color:#ff2442;">
                    </div>
                    <div class="control-group">
                        <label>底衬透明度 <span id="backdrop-opacity-val">100</span>%</label>
                        <input type="range" id="backdrop-opacity" min="10" max="100" value="100" style="width:100%;accent-color:#ff2442;">
                    </div>

                    <div id="backdrop-custom-controls" class="control-group" style="display:none; border-top:1px dashed #30363d; padding-top:8px; margin-top:8px;">
                        <label>图片平铺方式</label>
                        <select id="backdrop-sizemode">
                            <option value="cover">拉伸铺满 (cover)</option>
                            <option value="contain">完整显示 (contain)</option>
                            <option value="repeat">平铺重复 (repeat)</option>
                        </select>
                        <label style="margin-top:6px;">颜色叠加（可选）</label>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <input type="color" id="backdrop-overlay-color" value="#000000" style="flex:1;height:24px;border:1px solid #30363d;border-radius:4px;background:none;cursor:pointer;">
                            <button id="btn-backdrop-clear-overlay" class="btn" style="padding:2px 8px;font-size:10px;">清除</button>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3><i class="fa-solid fa-book-open"></i> 长文分页管理 (Canva 模式)</h3>
                    <div class="page-manager-controls">
                        <button id="btn-add-page" class="btn btn-primary" style="width:100%; justify-content:center; margin-bottom:10px;">
                            <i class="fa-solid fa-plus"></i> 增加新分页
                        </button>
                        <div id="page-list" class="page-list"></div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3><i class="fa-solid fa-layer-group"></i> 图层管理</h3>
                    <div id="layer-list" class="layer-list"></div>
                </div>
            </aside>
        </div>
    </div>

    <div id="context-menu" class="context-menu" style="display: none;">
        <ul>
            <li id="ctx-copy"><i class="fa-solid fa-copy"></i> 复制图层</li>
            <li id="ctx-copy-style"><i class="fa-solid fa-wand-magic"></i> 复制样式</li>
            <li id="ctx-paste"><i class="fa-solid fa-paste"></i> 粘贴样式</li>
            <li class="divider"></li>
            <li id="ctx-move-up"><i class="fa-solid fa-arrow-up"></i> 图层上移</li>
            <li id="ctx-move-down"><i class="fa-solid fa-arrow-down"></i> 图层下移</li>
            <li class="divider"></li>
            <li id="ctx-flip-h"><i class="fa-solid fa-arrows-left-right"></i> 水平翻转</li>
            <li id="ctx-flip-v"><i class="fa-solid fa-arrows-up-down"></i> 垂直翻转</li>
            <li id="ctx-rotate-90"><i class="fa-solid fa-rotate-right"></i> 顺时针 90°</li>
            <li class="divider"></li>
            <li id="ctx-delete" class="danger"><i class="fa-solid fa-trash"></i> 删除图层</li>
        </ul>
    </div>

    <!-- 贴纸面板 -->
    <div id="sticker-panel" class="sticker-panel" style="display: none;">
        <div class="sticker-panel-header" id="sticker-panel-drag-handle">
            <h3><i class="fa-solid fa-grip-vertical" style="color:#8b949e;cursor:move;"></i> <i class="fa-solid fa-face-smile"></i> 贴纸库</h3>
            <div style="display: flex; gap: 6px; align-items: center;">
                <button id="btn-upload-sticker" class="tool-btn" style="width: auto; padding: 0 8px; font-size: 10px;" title="上传本地图片作为贴纸（存 IndexedDB）">
                    <i class="fa-solid fa-upload"></i> 上传
                </button>
                <input type="file" id="local-sticker-file" accept="image/*" multiple style="display: none;">
                <button id="sticker-panel-close" class="tool-btn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="sticker-search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="sticker-search" placeholder="搜索贴纸（如：火、星、箭头、1）...">
        </div>
        <div class="sticker-tabs" id="sticker-tabs"></div>
        <div class="sticker-grid" id="sticker-grid"></div>

        <div class="sticker-color-bar" id="sticker-color-bar" style="display:none;">
            <label style="font-size:11px;color:#8b949e;">贴纸颜色</label>
            <div id="sticker-color-swatches" style="display:flex;gap:6px;"></div>
            <input type="color" id="sticker-color-custom" value="#ff2442" style="width:28px;height:24px;border:none;background:none;cursor:pointer;">
        </div>
    </div>

    <div id="align-guides" class="align-guides"></div>

    <script src="js/db.js"></script>
    <script src="js/backdrop-textures.js"></script>
    <script src="js/state.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/text-layers.js"></script>
    <script src="js/stickers.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
